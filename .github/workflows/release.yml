name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            qt: '5.15.2'
            host: windows
            target: desktop
            arch: win64_msvc2019_64
          # ubuntu-22.04: 较旧的 glibc，兼容 linuxdeployqt（ubuntu-latest 的 glibc 过新会被拒绝）
          - name: Linux
            os: ubuntu-22.04
            qt: '5.15.2'
            host: linux
            target: desktop
            arch: gcc_64
          - name: macOS
            os: macos-latest
            qt: '5.15.2'
            host: mac
            target: desktop
            arch: clang_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.config.qt }}
          host: ${{ matrix.config.host }}
          target: ${{ matrix.config.target }}
          arch: ${{ matrix.config.arch }}
          cache: true

      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ env.Qt5_DIR }}" 2>&1 | tee configure.log

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 2>&1 | tee build.log

      # ---------- Windows ----------
      - name: Deploy (Windows)
        if: matrix.config.os == 'windows-latest'
        shell: pwsh
        run: |
          windeployqt --release --no-translations --no-opengl-sw build\Release\listery.exe
          $redist = (Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC" -Recurse -Filter vcruntime140.dll | Select-Object -First 1).DirectoryName
          if ($redist) {
            Copy-Item "$redist\vcruntime140.dll"      build\Release\
            Copy-Item "$redist\msvcp140.dll"          build\Release\
            Copy-Item "$redist\vcruntime140_1.dll"    build\Release\
          }
          Compress-Archive -Path build\Release\* -DestinationPath listery-windows.zip -Force

      # ---------- Linux ----------
      - name: Deploy (Linux)
        if: matrix.config.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -o pipefail
          wget -q https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage -O linuxdeployqt.AppImage
          chmod +x linuxdeployqt.AppImage
          # runner 上无 FUSE：先解包再用 AppRun 运行
          ./linuxdeployqt.AppImage --appimage-extract >/dev/null
          mkdir -p app/usr/bin
          cp build/listery app/usr/bin/
          cat > app/listery.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Listery
          Exec=listery
          Icon=utilities-terminal
          Categories=Utility;
          EOF
          VERSION=1.0.0 ./squashfs-root/AppRun app/usr/bin/listery -appimage -no-translations
          ls *.AppImage
          mv Listery-*.AppImage listery-linux.AppImage 2>/dev/null || mv listery-*.AppImage listery-linux.AppImage

      # ---------- macOS ----------
      - name: Deploy (macOS)
        if: matrix.config.os == 'macos-latest'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p listery.app/Contents/MacOS listery.app/Contents/Resources
          cp build/listery listery.app/Contents/MacOS/listery
          cat > listery.app/Contents/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleName</key><string>Listery</string>
          <key>CFBundleExecutable</key><string>listery</string>
          <key>CFBundleIdentifier</key><string>com.listery.launcher</string>
          <key>CFBundleVersion</key><string>1.0.0</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          </dict></plist>
          EOF
          macdeployqt listery.app
          zip -r listery-macos.zip listery.app

      # 调试：失败时把日志写入各平台的 logs-* 分支（公开仓库可直接读）
      - name: Dump logs to logs branch
        if: failure()
        shell: bash
        run: |
          BR="logs-${{ matrix.config.name }}"
          git config user.email "ci@listery.local"
          git config user.name "listery-ci"
          git fetch origin "$BR" 2>/dev/null || true
          git checkout -B "$BR" "origin/$BR" 2>/dev/null || git checkout -B "$BR"
          mkdir -p ci-logs
          {
            echo "=== pwd: $(pwd)"
            echo "=== ls ==="
            ls -la
            echo "=== configure.log ==="
            cat configure.log 2>&1
            echo "=== build.log ==="
            cat build.log 2>&1
            echo "=== deploy.log ==="
            cat deploy.log 2>&1
          } > ci-logs/all.log
          git add -f ci-logs/all.log
          git status --porcelain
          git commit -m "ci logs: ${{ matrix.config.name }} run ${{ github.run_id }} $(date -u +%Y%m%d%H%M%S)" || true
          git push origin "$BR"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            listery-windows.zip
            listery-linux.AppImage
            listery-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

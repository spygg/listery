name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            qt: '5.15.2'
            host: windows
            target: desktop
            arch: win64_msvc2019_64
          # ubuntu-22.04: 较旧的 glibc，兼容 linuxdeployqt（ubuntu-latest 的 glibc 过新会被拒绝）
          - name: Linux
            os: ubuntu-22.04
            qt: '5.15.2'
            host: linux
            target: desktop
            arch: gcc_64
          - name: macOS
            os: macos-latest
            qt: '5.15.2'
            host: mac
            target: desktop
            arch: clang_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.config.qt }}
          host: ${{ matrix.config.host }}
          target: ${{ matrix.config.target }}
          arch: ${{ matrix.config.arch }}
          cache: true

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ env.Qt5_DIR }}" 2>&1 | tee configure.log || true

      - name: Build
        shell: bash
        run: |
          set +e
          cmake --build build --config Release --parallel 2>&1 | tee build.log
          echo "BUILD_EXIT=$?" >> "$GITHUB_ENV"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.config.name }}
          path: |
            configure.log
            build.log
          if-no-files-found: warn

      # ---------- Windows ----------
      - name: Deploy (Windows)
        if: matrix.config.os == 'windows-latest' && env.BUILD_EXIT == '0'
        shell: pwsh
        run: |
          windeployqt --release --no-translations --no-opengl-sw build\Release\listery.exe
          $redist = (Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC" -Recurse -Filter vcruntime140.dll | Select-Object -First 1).DirectoryName
          if ($redist) {
            Copy-Item "$redist\vcruntime140.dll"      build\Release\
            Copy-Item "$redist\msvcp140.dll"          build\Release\
            Copy-Item "$redist\vcruntime140_1.dll"    build\Release\
          }
          Compress-Archive -Path build\Release\* -DestinationPath listery-windows.zip -Force

      # ---------- Linux ----------
      - name: Deploy (Linux)
        if: matrix.config.os == 'ubuntu-22.04' && env.BUILD_EXIT == '0'
        shell: bash
        run: |
          set +e
          {
          wget -q https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage -O linuxdeployqt.AppImage
          chmod +x linuxdeployqt.AppImage
          # runner 上无 FUSE：先解包再用 AppRun 运行
          ./linuxdeployqt.AppImage --appimage-extract >/dev/null
          mkdir -p app/usr/bin
          cp build/listery app/usr/bin/
          cat > app/listery.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Listery
          Exec=listery
          Icon=utilities-terminal
          Categories=Utility;
          EOF
          VERSION=1.0.0 ./squashfs-root/AppRun app/usr/bin/listery -appimage -no-translations
          ls *.AppImage
          } 2>&1 | tee deploy.log
          mv Listery-*.AppImage listery-linux.AppImage 2>/dev/null || mv listery-*.AppImage listery-linux.AppImage

      # ---------- macOS ----------
      - name: Deploy (macOS)
        if: matrix.config.os == 'macos-latest' && env.BUILD_EXIT == '0'
        shell: bash
        run: |
          set +e
          {
          mkdir -p listery.app/Contents/MacOS listery.app/Contents/Resources
          cp build/listery listery.app/Contents/MacOS/listery
          cat > listery.app/Contents/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleName</key><string>Listery</string>
          <key>CFBundleExecutable</key><string>listery</string>
          <key>CFBundleIdentifier</key><string>com.listery.launcher</string>
          <key>CFBundleVersion</key><string>1.0.0</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          </dict></plist>
          EOF
          macdeployqt listery.app
          zip -r listery-macos.zip listery.app
          } 2>&1 | tee deploy.log

      - name: Upload deploy logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-log-${{ matrix.config.name }}
          path: |
            deploy.log
          if-no-files-found: ignore

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            listery-windows.zip
            listery-linux.AppImage
            listery-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
